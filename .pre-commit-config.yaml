repos:
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        args:
          - -shellcheck=
          - -pyflakes=

  - repo: local
    hooks:
      - id: check-format
        name: Check Ruff formatting
        entry: ruff format --check .
        language: system
        files: ^(.*\.py|pyproject\.toml|ruff\.toml)$
        pass_filenames: false
      - id: typecheck
        name: Check Pyrefly types
        entry: pyrefly check --min-severity=warn --output-format=min-text --progress-bar=no
        language: system
        files: ^(app/|extensions/|libs/|migrations/|scripts/|tests/|utils/|run\.py$|pyproject\.toml$|pdm\.lock$)
        pass_filenames: false
      - id: check-lock
        name: Check PDM lock
        entry: python scripts/check_lock.py
        language: system
        files: ^(pyproject\.toml|pdm\.lock)$
        pass_filenames: false
      - id: check-requirements
        name: Check requirements export
        entry: python scripts/check_requirements.py
        language: system
        files: ^(pyproject\.toml|pdm\.lock|requirements\.txt)$
        pass_filenames: false
      - id: lint-migrations
        name: Lint migration contract
        entry: ruff check --no-cache migrations/env.py migrations/metadata.py migrations/settings.py scripts/_tooling.py scripts/doctor.py scripts/check_lock.py scripts/check_requirements.py scripts/check_migration_history.py scripts/database_manifest.py scripts/sanitize_preview_base.py tests/migrations
        language: system
        files: ^(Procfile|alembic\.ini|migrations/|scripts/|tests/migrations/)
        pass_filenames: false
      - id: test-migrations
        name: Test migration contract
        entry: python -m pytest -q tests/migrations
        language: system
        files: ^(Procfile|alembic\.ini|migrations/|tests/migrations/)
        pass_filenames: false
      - id: lint-settings
        name: Lint settings contract
        entry: ruff check --no-cache tests/test_settings.py
        language: system
        files: ^(app/settings\.py|libs/obsrv/setting\.py|tests/test_settings\.py)$
        pass_filenames: false
      - id: test-settings
        name: Test settings contract
        entry: python -m pytest -q tests/test_settings.py
        language: system
        files: ^(app/settings\.py|libs/obsrv/setting\.py|tests/test_settings\.py)$
        pass_filenames: false
