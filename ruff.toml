line-length = 92
indent-width = 2
extend-exclude = ["migrations/versions", "*.md", "cli", ".agents"]

[format]
indent-style = "space"
line-ending = "lf"

[lint]
select = [
    "E501",    # line length limit
    "F821",    # undefined-name
    "B006",    # mutable-argument-default
    "E722",    # bare-except
    "PLE0101", # return-in-init (Pylint)
    "RUF006",  # asyncio-dangling-task

    "S105", # hardcoded-password-string (Bandit)
    "S301", # suspicious-pickle-usage (Bandit)
    "S307", # suspicious-eval-usage (Bandit)
    "S602", # subprocess-popen-with-shell-equals-true (Bandit)
    "S603", # subprocess-without-shell-equals-true (Bandit)

    "F401", # unused-import

    "PLR0913", # too-many-arguments (Pylint)

    "UP007", # non-pep604-annotation (pyupgrade)
    "UP032", # f-string (pyupgrade)

    "SIM115",  # open-file-with-context-handler (flake8-simplify)
    "PLW1510", # subprocess-run-without-check (Pylint)
    "RUF100",  # unused-noqa
]

[lint.pycodestyle]
max-line-length = 92

# Scope is selected by lint:database-boundaries during the runtime migration.
[lint.flake8-tidy-imports.banned-api]
"app.engine".msg = "应用操作和 repository 不能创建 session；通过 UoW 组合。"
"sqlmodel.Session".msg = "已迁移数据库路径不能使用同步 session。"
"sqlalchemy.orm.Session".msg = "已迁移数据库路径不能使用同步 session。"
"sqlmodel.create_engine".msg = "Engine 只能由数据库基础设施创建。"
"sqlalchemy.create_engine".msg = "Engine 只能由数据库基础设施创建。"
"sqlalchemy.ext.asyncio.create_async_engine".msg = "Engine 只能由数据库基础设施创建。"
"sqlalchemy.ext.asyncio.async_sessionmaker".msg = "Session factory 只能由数据库基础设施创建。"
"app.business.info_base.block".msg = "已迁移路径使用 session-bound repository，不能调用旧同步 Manager。"
"app.business.info_base.relation".msg = "已迁移路径使用 session-bound repository，不能调用旧同步 Manager。"
"app.business.info_base.main".msg = "已迁移路径不能调用旧同步持久化入口。"
