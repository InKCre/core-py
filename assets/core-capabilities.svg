<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="505" viewBox="0 0 1200 505" role="img" aria-label="InKCre Core Capability Ownership"><style>
  .canvas{fill:#fbfbfb}.surface{fill:#fff;stroke:#c7cbd2;stroke-width:1.5}.muted{fill:#f4f6f8;stroke:#c7cbd2;stroke-width:1.5}
  .ink{fill:#15191f}.sub{fill:#525a66}.hint{fill:#6d7480}.accent{fill:#255cba}.blue{fill:#edf3ff;stroke:#255cba;stroke-width:1.5}
  .line{fill:none;stroke:#9199a3;stroke-width:2}.active{fill:none;stroke:#255cba;stroke-width:2}.dash{fill:none;stroke:#9ca3ad;stroke-width:1.8;stroke-dasharray:5,5}
  text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
  .k{font-size:13px;font-weight:700;letter-spacing:1.8px}.h{font-size:25px;font-weight:650}.name{font-size:19px;font-weight:650}.body{font-size:16px}.small{font-size:14px}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:14px}
</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#9199a3" stroke-width="1.5" /></marker></defs><rect class="canvas" width="1200" height="505"/><text class="k accent" x="44" y="45">CORE-PY / CAPABILITY BOUNDARIES</text><text class="h ink" x="44" y="85">One authoritative graph. Distinct responsibilities.</text><rect class="surface" x="240" y="116" width="720" height="145" /><text class="k accent" x="268" y="152">PERSISTED INFO-BASE</text><text class="h ink" x="268" y="192">Blocks + Relations</text><text class="small sub" x="268" y="222">PostgreSQL owns shared graph state; search indexes are derived</text><rect class="muted" x="36" y="316" width="180" height="109" /><text class="name ink" x="51" y="347">Sources</text><text class="small sub" x="51" y="376">Collect from</text><text class="small sub" x="51" y="398">outside systems</text><path class="dash" d="M126 316 V279 H600 V261"/><rect class="muted" x="231" y="316" width="180" height="109" /><text class="name ink" x="246" y="347">Resolvers</text><text class="small sub" x="246" y="376">Interpret content</text><text class="small sub" x="246" y="398">+ local graph</text><path class="dash" d="M321 316 V279 H600 V261"/><rect class="muted" x="426" y="316" width="180" height="109" /><text class="name ink" x="441" y="347">Storage</text><text class="small sub" x="441" y="376">Access content</text><text class="small sub" x="441" y="398">bytes</text><path class="dash" d="M516 316 V279 H600 V261"/><rect class="muted" x="621" y="316" width="180" height="109" /><text class="name ink" x="636" y="347">Organization</text><text class="small sub" x="636" y="376">Explicit graph</text><text class="small sub" x="636" y="398">changes</text><path class="dash" d="M711 316 V279 H600 V261"/><rect class="muted" x="816" y="316" width="180" height="109" /><text class="name ink" x="831" y="347">Retrieval</text><text class="small sub" x="831" y="376">Text · meaning ·</text><text class="small sub" x="831" y="398">graph paths</text><path class="dash" d="M906 316 V279 H600 V261"/><rect class="muted" x="1011" y="316" width="180" height="109" /><text class="name ink" x="1026" y="347">Sinks</text><text class="small sub" x="1026" y="376">Expose capability</text><text class="small sub" x="1026" y="398">to apps &amp; agents</text><path class="dash" d="M1101 316 V279 H600 V261"/><text class="small sub" x="44" y="469">Independent capability ownership; the diagram does not prescribe a fixed processing pipeline.</text></svg>