  "extensions/github/stars.py",
  "extensions/rss/**/*.py",
  "extensions/mail/**/*.py",
  "extensions/telegram/**/*.py",
  "extensions/twitter/**/*.py",
  "extensions/memos/**/*.py",
  "app/persistence/info_base/storage.py",
  "app/business/lexical_retrieval/**/*.py",
  "app/business/semantic_retrieval/**/*.py",
  "app/business/graph_navigation_retrieval/**/*.py",
  "app/business/organization/**/*.py",
  "app/business/organization_media.py",
  "app/business/job.py",
  "app/business/cron.py",
  "app/business/sink/main.py",
  "app/business/agent/main.py",
