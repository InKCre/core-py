name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set branch expiration
        if: >-
          github.event_name != 'push' &&
          github.event_name != 'pull_request'
        run: >-
          echo "EXPIRES_AT=$(date -u --date '+7 days'
          +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Create DB Branch
        if: >-
          github.event_name != 'push' &&
          github.event_name != 'pull_request'
        id: create_db_branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: copilot/run-${{ github.run_id }}
          parent_branch: preview-base
          expires_at: ${{ env.EXPIRES_AT }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Write database URL to .env
        if: >-
          github.event_name != 'push' &&
          github.event_name != 'pull_request'
        env:
          DATABASE_URL: ${{ steps.create_db_branch.outputs.db_url_pooled }}
        run: |
          echo "DATABASE_URL=$DATABASE_URL" > .env
          echo "✅ Database URL written to .env file"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up PDM
        uses: pdm-project/setup-pdm@v4
        with:
          python-version: "3.12"
          cache: true

      - name: Install dependencies
        run: pdm install -G dev --frozen-lockfile
