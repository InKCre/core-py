name: Temporary PR 100 Agent debug

on:
  push:
    branches: [feat/organization-nowledge-vertical]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: preview-agent-debug-pr-100
  cancel-in-progress: true

jobs:
  configure:
    if: github.repository == 'InKCre/core-py'
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Enable Agent debug after this preview deployment
        env:
          GH_TOKEN: ${{ github.token }}
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 scripts/preview_agent_debug.py
