name: Publish runtime artifact

on:
  workflow_run:
    workflows:
      - Repository and artifact checks
    types:
      - completed

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: publish-runtime-artifact
  cancel-in-progress: false

jobs:
  publish:
    name: Publish exact main image
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact verified source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Verify source is current main
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$HEAD_SHA"

      - name: Download checked database schema evidence
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: core-database-contract
          path: release/database-contract
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify exact schema evidence
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python scripts/package_database_schema.py \
            --schema release/database-contract/database-schema.sql \
            --roles release/database-contract/database-roles.sql \
            --runtime-contract release/database-contract/runtime-contract.json \
            --output "$RUNNER_TEMP/manifest.json" \
            --source-revision "$HEAD_SHA"
          cmp "$RUNNER_TEMP/manifest.json" release/database-contract/manifest.json

      - name: Build and publish immutable runtime
        id: image
        env:
          GHCR_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          image="ghcr.io/$repository"
          commit_ref="$image:$HEAD_SHA"

          docker build \
            --platform linux/amd64 \
            --provenance=false \
            --build-arg "SOURCE_REVISION=$HEAD_SHA" \
            --target service \
            --tag "$commit_ref" \
            .
          test "$(docker inspect --format='{{json .Config.Entrypoint}}' "$commit_ref")" = "null"
          docker inspect --format='{{json .Config.Cmd}}' "$commit_ref" |
            jq -e '. == ["python", "scripts/container.py", "web"]' >/dev/null
          docker run --rm "$commit_ref" \
            python scripts/container.py db schema --json >/dev/null
          test "$(docker inspect --format='{{.Config.User}}' "$commit_ref")" = "inkcre"
          docker run --rm "$commit_ref" python -c \
            'import pathlib, pip; assert not pathlib.Path("/app/extensions").exists()'

          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$commit_ref"
          docker pull "$commit_ref" >/dev/null

          digest_ref="$(
            docker inspect --format='{{index .RepoDigests 0}}' "$commit_ref"
          )"
          test "${digest_ref%%@*}" = "$image"
          echo "commit_ref=$commit_ref" >> "$GITHUB_OUTPUT"
          echo "digest_ref=$digest_ref" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Promote mutable main image
        id: promote
        env:
          COMMIT_REF: ${{ steps.image.outputs.commit_ref }}
          DIGEST_REF: ${{ steps.image.outputs.digest_ref }}
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          docker tag "$COMMIT_REF" "$IMAGE:main"
          docker push "$IMAGE:main"
          docker pull "$IMAGE:main" >/dev/null
          docker inspect \
            --format='{{range .RepoDigests}}{{println .}}{{end}}' \
            "$IMAGE:main" |
            grep --fixed-strings --line-regexp "$DIGEST_REF"

      - name: Record runtime delivery identity
        if: always() && steps.image.outcome == 'success'
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest_ref }}
          MAIN_PROMOTION: ${{ steps.promote.outcome }}
        run: |
          {
            echo "### core-py runtime"
            echo
            echo "- Delivery source revision: \`$HEAD_SHA\`"
            echo "- Immutable image: \`$IMAGE_DIGEST\`"
            echo "- Mutable main promotion: \`$MAIN_PROMOTION\`"
            echo "- Contract command: \`python scripts/container.py db contract --json\`"
            echo "- Schema command: \`python scripts/container.py db schema --json\`"
          } >> "$GITHUB_STEP_SUMMARY"
