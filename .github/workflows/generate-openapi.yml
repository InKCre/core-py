name: Generate OpenAPI Documentation

on:
  push:
    branches:
      - staging
      - main

jobs:
  generate-openapi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDM
        uses: pdm-project/setup-pdm@v3
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pdm install

      - name: Generate OpenAPI schema
        env:
          DATABASE_URL: "postgresql+psycopg://localhost/dummy"
          JWT_SECRET: "dummy-secret-for-openapi-generation"
          EXTENSION_SYNC_SKIP: "1"
        run: pdm run python scripts/generate-openapi.py

      - name: Check if schema changed
        id: check_changes
        run: |
          if git diff --quiet docs/openapi.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/openapi.json
          git commit -m "chore: update OpenAPI documentation"
          git push
