name: Preview application

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - closed

permissions:
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: preview-application-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: Checkout trusted delivery implementation
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.workflow_sha }}
          path: .delivery
          persist-credentials: false

      - name: Verify exact pull request head
        uses: ./.delivery/.github/actions/preview-verify
        with:
          github_token: ${{ github.token }}
          head_sha: ${{ github.event.pull_request.head.sha }}
          pr_number: ${{ github.event.pull_request.number }}

      - name: Checkout isolated pull request source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: source
          persist-credentials: false

      - name: Set up frozen Extension preview tooling
        uses: pdm-project/setup-pdm@973541a5febeafcfdadf8a51211435be6ecfd90f # v4.5
        with:
          python-version-file: source/.python-version
          version: 2.27.0
          cache: true
          cache-dependency-path: source/pdm.lock

      - name: Install frozen Extension preview tooling
        working-directory: source
        run: >-
          pdm install --no-default --group extension-preview --frozen-lockfile

      - name: Build exact-head Extension wheels and sibling Registry facade
        env:
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_EXTENSION_PREVIEW_PROJECT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        working-directory: source
        run: |
          test "$PAGES_PROJECT" = inkcre-core-py-extension-registry-preview
          case "$PR_NUMBER" in
            ''|*[!0-9]*)
              echo "Invalid pull request number" >&2
              exit 1
              ;;
          esac
          preview_inputs="$GITHUB_WORKSPACE/.extension-preview-inputs"
          preview_registry="$GITHUB_WORKSPACE/.extension-preview-registry"
          public_origin="https://pr-$PR_NUMBER.$PAGES_PROJECT.pages.dev"
          pdm run build:extension-preview --output "$preview_inputs"
          pdm run inkcre-ext preview build \
            --inventory "$preview_inputs/extensions.json" \
            --public-origin "$public_origin" \
            --output "$preview_registry"

      - name: Build peer transport images without deployment secrets
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docker build \
            --platform linux/amd64 \
            --provenance=false \
            --target heroku-web \
            --tag "inkcre-preview-web:$HEAD_SHA" \
            "${{ github.workspace }}/source"
          docker build \
            --platform linux/amd64 \
            --provenance=false \
            --target heroku-release \
            --tag "inkcre-preview-release:$HEAD_SHA" \
            "${{ github.workspace }}/source"
          docker build \
            --platform linux/amd64 \
            --provenance=false \
            --file "${{ github.workspace }}/source/Dockerfile.postgrest" \
            --build-arg "SOURCE_REVISION=$HEAD_SHA" \
            --tag "inkcre-preview-postgrest:$HEAD_SHA" \
            "${{ github.workspace }}/source"

      - name: Reverify preview authority before delivery
        uses: ./.delivery/.github/actions/preview-verify
        with:
          github_token: ${{ github.token }}
          head_sha: ${{ github.event.pull_request.head.sha }}
          pr_number: ${{ github.event.pull_request.number }}

      - name: Deploy exact-head sibling Registry to isolated Pages branch
        id: extension-registry
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          wranglerVersion: 4.120.0
          workingDirectory: .extension-preview-registry
          command: >-
            pages deploy .
            --project-name=${{ vars.CLOUDFLARE_EXTENSION_PREVIEW_PROJECT }}
            --branch=pr-${{ github.event.pull_request.number }}
            --commit-hash=${{ github.event.pull_request.head.sha }}
            --commit-dirty=false

      - name: Verify stable sibling Registry alias and static read surface
        id: extension-registry-smoke
        env:
          EXPECTED_URL: >-
            https://pr-${{ github.event.pull_request.number }}.${{ vars.CLOUDFLARE_EXTENSION_PREVIEW_PROJECT }}.pages.dev
          PAGES_ALIAS_URL: ${{ steps.extension-registry.outputs.pages-deployment-alias-url }}
        run: |
          test "${PAGES_ALIAS_URL%/}" = "$EXPECTED_URL"
          find "$GITHUB_WORKSPACE/.extension-preview-registry" \
            -type f ! -name _headers -print0 | sort --zero-terminated |
            while IFS= read -r -d '' local_file; do
              relative="${local_file#"$GITHUB_WORKSPACE/.extension-preview-registry/"}"
              if [[ "$relative" == */index.html ]]; then
                relative="${relative%index.html}"
              fi
              remote_file="$RUNNER_TEMP/extension-preview-smoke"
              verified=0
              for attempt in {1..30}; do
                if curl --fail --silent --show-error \
                  --connect-timeout 5 \
                  --max-time 30 \
                  --output "$remote_file" \
                  "$EXPECTED_URL/$relative" && cmp "$local_file" "$remote_file"; then
                  verified=1
                  break
                fi
                sleep 2
              done
              test "$verified" -eq 1
            done
          echo "url=$EXPECTED_URL" >> "$GITHUB_OUTPUT"

      - name: Reverify preview authority before Heroku delivery
        uses: ./.delivery/.github/actions/preview-verify
        with:
          github_token: ${{ github.token }}
          head_sha: ${{ github.event.pull_request.head.sha }}
          pr_number: ${{ github.event.pull_request.number }}

      - name: Deliver preview
        uses: ./.delivery/.github/actions/preview-delivery
        with:
          core_database_password: ${{ secrets.CORE_DATABASE_PASSWORD }}
          extension_registry_url: ${{ steps.extension-registry-smoke.outputs.url }}
          head_sha: ${{ github.event.pull_request.head.sha }}
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          neon_api_key: ${{ secrets.NEON_API_KEY }}
          neon_project_id: ${{ vars.NEON_PROJECT_ID }}
          postgrest_database_password: ${{ secrets.POSTGREST_DATABASE_PASSWORD }}
          jwt_secret: ${{ secrets.JWT_SECRET }}
          pr_number: ${{ github.event.pull_request.number }}

  cleanup:
    name: Retire preview resources
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: Checkout trusted cleanup controller
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.workflow_sha }}
          path: .delivery
          persist-credentials: false

      - name: Install pinned Heroku CLI
        run: npm install --global heroku@11.8.1

      - name: Verify sibling Registry cleanup identity
        env:
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_EXTENSION_PREVIEW_PROJECT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          test "$PAGES_PROJECT" = inkcre-core-py-extension-registry-preview
          case "$PR_NUMBER" in
            ''|*[!0-9]*)
              echo "Invalid pull request number" >&2
              exit 1
              ;;
          esac

      - name: Replace sibling Registry alias with trusted tombstone
        id: extension-registry-tombstone
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          wranglerVersion: 4.120.0
          workingDirectory: .delivery/.github/pages-preview-closed
          command: >-
            pages deploy .
            --project-name=${{ vars.CLOUDFLARE_EXTENSION_PREVIEW_PROJECT }}
            --branch=pr-${{ github.event.pull_request.number }}
            --commit-hash=${{ github.workflow_sha }}
            --commit-dirty=false

      - name: Verify retired sibling Registry alias
        env:
          EXPECTED_URL: >-
            https://pr-${{ github.event.pull_request.number }}.${{ vars.CLOUDFLARE_EXTENSION_PREVIEW_PROJECT }}.pages.dev
          PAGES_ALIAS_URL: ${{ steps.extension-registry-tombstone.outputs.pages-deployment-alias-url }}
        run: |
          test "${PAGES_ALIAS_URL%/}" = "$EXPECTED_URL"
          curl --fail --silent --show-error "$EXPECTED_URL/" |
            grep --fixed-strings 'This pull-request preview is no longer active.'

      - name: Delete exact deterministic apps
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          case "$PR_NUMBER" in
            ''|*[!0-9]*)
              echo "Invalid pull request number" >&2
              exit 1
              ;;
          esac
          for app_name in \
            "inkcre-core-py-pr-$PR_NUMBER" \
            "inkcre-postgrest-pr-$PR_NUMBER"; do
            if heroku apps:info --app "$app_name" >/dev/null 2>&1; then
              heroku apps:destroy --app "$app_name" --confirm "$app_name"
            fi
          done
