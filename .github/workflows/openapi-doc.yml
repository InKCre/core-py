name: Check & deploy API documentation
permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches:
      - main
      - staging
      - develop
  pull_request:
    branches:
      - main
      - staging
      - develop

jobs:
  generate-openapi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDM
        uses: pdm-project/setup-pdm@v3
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pdm install

      - name: Generate OpenAPI schema
        env:
          DATABASE_URL: ${{secrets.DATABASE_URL}}
          DATABASE_SCALE_0: ${{vars.DATABASE_SCALE_0}}
          JWT_SECRET: "dummy-secret-for-openapi-generation"
          SKIP_EXTENSIONS_SYNC: "1"
          OBSRV__LOGGING_BACKEND: "none"
        run: pdm run python scripts/generate-openapi.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update OpenAPI documentation"
          file_pattern: docs/openapi.json

  deploy-doc:
    # 注意：如果 generate-openapi 推送了新代码，由于 GitHub 机制限制，
    # 默认不会触发新的 workflow。且此 Job 与上面是并行运行的，
    # 它部署的可能是旧的 docs（取决于 checkout 的时机）。
    # 如果希望严格部署新生成的文档，这里的逻辑可能需要后续优化（例如使用 artifact）。
    if: ${{ github.event_name == 'push' }}
    name: Deploy API documentation on Bump.sh
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Deploy API documentation
        uses: bump-sh/github-action@v1
        with:
          doc: core
          token: ${{secrets.BUMP_SH_TOKEN}}
          file: docs/openapi.json

  api-diff:
    if: ${{ github.event_name == 'pull_request' }}
    name: Check API diff on Bump.sh
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Comment pull request with API diff
        uses: bump-sh/github-action@v1
        with:
          doc: core
          token: ${{secrets.BUMP_SH_TOKEN}}
          file: docs/openapi.json
          command: diff
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
