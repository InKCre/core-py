name: Reusable preview delivery

on:
  workflow_call:
    inputs:
      head_sha:
        description: Exact pull request head commit to deploy
        required: true
        type: string
      pr_number:
        description: Pull request number
        required: true
        type: number

permissions:
  checks: read
  contents: read
  pull-requests: read

jobs:
  deploy:
    name: Deploy Heroku preview
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: Verify trusted pull request and required checks
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          case "$PR_NUMBER" in
            ''|*[!0-9]*)
              echo "Invalid pull request number" >&2
              exit 1
              ;;
          esac

          pr_json="$(
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER"
          )"
          test "$(jq -r '.head.repo.full_name' <<<"$pr_json")" = "$GITHUB_REPOSITORY"
          test "$(jq -r '.head.sha' <<<"$pr_json")" = "$HEAD_SHA"

          required_checks=(
            "Hermetic repository contract"
            "Portable artifact and fresh database"
            "Provision and migrate"
          )

          for _ in $(seq 1 120); do
            checks_json="$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?per_page=100"
            )"
            all_green=true
            for check_name in "${required_checks[@]}"; do
              conclusion="$(
                jq -r --arg name "$check_name" \
                  '[.check_runs[] | select(.name == $name)] | last | .conclusion // ""' \
                  <<<"$checks_json"
              )"
              if [ "$conclusion" != "success" ]; then
                all_green=false
              fi
            done
            if [ "$all_green" = true ]; then
              exit 0
            fi
            sleep 5
          done

          echo "Required checks did not become green for $HEAD_SHA" >&2
          exit 1

      - name: Checkout exact pull request head
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.head_sha }}

      - name: Build web and release images without deployment secrets
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          docker build --target web --tag "inkcre-preview-web:$HEAD_SHA" .
          docker build --target release --tag "inkcre-preview-release:$HEAD_SHA" .

      - name: Install pinned deployment CLIs
        run: npm install --global heroku@11.8.1

      - name: Resolve matching Neon preview URL
        id: neon
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          database_url="$(
            npx --yes neonctl@2.36.0 connection-string \
              "preview/pr-$PR_NUMBER" \
              --project-id "$NEON_PROJECT_ID" \
              --role-name neondb_owner \
              --pooled \
              --no-color
          )"
          echo "::add-mask::$database_url"
          echo "database_url=$database_url" >> "$GITHUB_OUTPUT"

      - name: Create or verify deterministic Heroku app
        id: heroku
        env:
          DATABASE_URL: ${{ steps.neon.outputs.database_url }}
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          LLM_SP_AK: ${{ secrets.LLM_SP_AK }}
          LLM_SP_BASE_URL: ${{ secrets.LLM_SP_BASE_URL }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          app_name="inkcre-core-pr-$PR_NUMBER"
          if ! app_json="$(heroku apps:info --app "$app_name" --json 2>/dev/null)"; then
            heroku apps:create "$app_name" --region us --stack container
            app_json="$(heroku apps:info --app "$app_name" --json)"
          fi

          test "$(jq -r '.app.stack.name' <<<"$app_json")" = "container"
          test "$(jq -r '.app.region.name' <<<"$app_json")" = "us"

          pipeline_json="$(heroku pipelines:info inkcre-core --json)"
          stage="$(
            jq -r --arg app "$app_name" \
              '.apps[] | select(.name == $app) | .pipelineCoupling.stage // empty' \
              <<<"$pipeline_json"
          )"
          if [ -z "$stage" ]; then
            heroku pipelines:add inkcre-core --app "$app_name" --stage review
          else
            test "$stage" = "review"
          fi

          web_url="$(jq -r '.app.web_url' <<<"$app_json")"
          jwt_secret="$(heroku config:get JWT_SECRET --app "$app_name")"
          if [ -z "$jwt_secret" ]; then
            jwt_secret="$(openssl rand -hex 32)"
          fi
          client_id="$(
            python -c \
              "import uuid; print(uuid.uuid5(uuid.NAMESPACE_URL, 'inkcre-core-pr-$PR_NUMBER'))"
          )"

          heroku config:set --app "$app_name" \
            "CLIENT_BASE_URL=$web_url" \
            "CLIENT_ID=$client_id" \
            "CLIENT_NAME=core-py-pr-$PR_NUMBER" \
            "DATABASE_SCALE_0=true" \
            "DATABASE_URL=$DATABASE_URL" \
            "INKCRE_ENV_FILE=" \
            "JWT_SECRET=$jwt_secret" \
            "LLM_SP_AK=$LLM_SP_AK" \
            "LLM_SP_BASE_URL=$LLM_SP_BASE_URL" \
            "OBSRV__LOGGING_BACKEND=none" \
            "SKIP_EXTENSIONS_SYNC=0" >/dev/null

          echo "app_name=$app_name" >> "$GITHUB_OUTPUT"
          echo "web_url=$web_url" >> "$GITHUB_OUTPUT"

      - name: Push and release web and migration processes
        env:
          APP_NAME: ${{ steps.heroku.outputs.app_name }}
          HEAD_SHA: ${{ inputs.head_sha }}
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          printf '%s' "$HEROKU_API_KEY" |
            docker login --username=_ --password-stdin registry.heroku.com
          docker tag \
            "inkcre-preview-web:$HEAD_SHA" \
            "registry.heroku.com/$APP_NAME/web"
          docker tag \
            "inkcre-preview-release:$HEAD_SHA" \
            "registry.heroku.com/$APP_NAME/release"
          docker push "registry.heroku.com/$APP_NAME/web"
          docker push "registry.heroku.com/$APP_NAME/release"
          heroku container:release web release --app "$APP_NAME"
          heroku ps:scale web=1:eco --app "$APP_NAME"

      - name: Probe deployed preview
        env:
          APP_NAME: ${{ steps.heroku.outputs.app_name }}
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          WEB_URL: ${{ steps.heroku.outputs.web_url }}
        run: |
          for _ in $(seq 1 60); do
            if curl --fail --silent "${WEB_URL}livez" >/dev/null &&
              curl --fail --silent "${WEB_URL}readyz" >/dev/null; then
              {
                echo "### Heroku preview"
                echo
                echo "- App: \`$APP_NAME\`"
                echo "- URL: $WEB_URL"
                echo "- Liveness: ready"
                echo "- Readiness: ready"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done

          heroku logs --num 200 --app "$APP_NAME"
          exit 1
