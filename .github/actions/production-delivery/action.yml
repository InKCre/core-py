name: Heroku production delivery
description: Release and probe prebuilt process images for the canonical production branch

inputs:
  core_database_password:
    description: Production native runtime role password
    required: true
  core_image_digest:
    description: Immutable GHCR reference for the canonical core service image
    required: true
  head_sha:
    description: Exact main commit to deploy
    required: true
  heroku_api_key:
    description: Dedicated Heroku production delivery authorization
    required: true
  heroku_app_name:
    description: Exact production app name
    required: true
  jwt_secret:
    description: Production JWT signing secret
    required: true
  neon_api_key:
    description: Neon authorization for resolving production connections
    required: true
  neon_branch_id:
    description: Exact canonical production branch ID
    required: true
  neon_project_id:
    description: Neon project containing the production branch
    required: true
  postgrest_app_name:
    description: Exact canonical production PostgREST app name
    required: true
  postgrest_database_password:
    description: Production PostgREST authenticator role password
    required: true

runs:
  using: composite
  steps:
    - name: Install pinned deployment CLIs
      shell: bash
      run: npm install --global heroku@11.8.1

    - name: Resolve production database URLs
      id: neon
      shell: bash
      env:
        NEON_API_KEY: ${{ inputs.neon_api_key }}
        NEON_BRANCH_ID: ${{ inputs.neon_branch_id }}
        NEON_PROJECT_ID: ${{ inputs.neon_project_id }}
      run: bash scripts/automation/production_delivery.sh resolve-neon

    - name: Resolve production apps
      id: heroku
      shell: bash
      env:
        HEROKU_API_KEY: ${{ inputs.heroku_api_key }}
        HEROKU_APP_NAME: ${{ inputs.heroku_app_name }}
        POSTGREST_APP_NAME: ${{ inputs.postgrest_app_name }}
      run: bash scripts/automation/production_delivery.sh resolve-apps

    - name: Converge the production database contract
      id: database
      shell: bash
      env:
        CORE_DATABASE_PASSWORD: ${{ inputs.core_database_password }}
        HEAD_SHA: ${{ inputs.head_sha }}
        MIGRATION_DATABASE_URL: ${{ steps.neon.outputs.direct_owner_database_url }}
        POOLED_OWNER_DATABASE_URL: ${{ steps.neon.outputs.pooled_owner_database_url }}
        POSTGREST_DATABASE_PASSWORD: ${{ inputs.postgrest_database_password }}
      run: bash scripts/automation/production_delivery.sh converge-database

    - name: Push and release canonical peer processes
      id: release
      shell: bash
      env:
        APP_NAME: ${{ steps.heroku.outputs.app_name }}
        DATABASE_URL: ${{ steps.database.outputs.core_database_url }}
        HEAD_SHA: ${{ inputs.head_sha }}
        HEROKU_API_KEY: ${{ inputs.heroku_api_key }}
        JWT_SECRET: ${{ inputs.jwt_secret }}
        POSTGREST_APP_NAME: ${{ steps.heroku.outputs.postgrest_app_name }}
        POSTGREST_DATABASE_URL: ${{ steps.database.outputs.postgrest_database_url }}
      run: bash scripts/automation/production_delivery.sh release

    - name: Converge production Peer advertisement
      shell: bash
      env:
        APP_NAME: ${{ steps.heroku.outputs.app_name }}
        DATABASE_URL: ${{ steps.database.outputs.core_database_url }}
        HEAD_SHA: ${{ inputs.head_sha }}
        WEB_URL: ${{ steps.heroku.outputs.web_url }}
      run: bash scripts/automation/production_delivery.sh advertise

    - name: Probe production peers
      shell: bash
      env:
        APP_NAME: ${{ steps.heroku.outputs.app_name }}
        CORE_IMAGE_DIGEST: ${{ inputs.core_image_digest }}
        CORE_LOCAL_IMAGE_ID: ${{ steps.release.outputs.core_local_image_id }}
        HEAD_SHA: ${{ inputs.head_sha }}
        HEROKU_API_KEY: ${{ inputs.heroku_api_key }}
        JWT_SECRET: ${{ inputs.jwt_secret }}
        POSTGREST_APP_NAME: ${{ steps.heroku.outputs.postgrest_app_name }}
        POSTGREST_RELEASE: ${{ steps.release.outputs.postgrest_release }}
        POSTGREST_URL: ${{ steps.heroku.outputs.postgrest_url }}
        WEB_RELEASE: ${{ steps.release.outputs.web_release }}
        WEB_URL: ${{ steps.heroku.outputs.web_url }}
      run: bash scripts/automation/production_delivery.sh probe
