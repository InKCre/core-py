name: Verify production source
description: Require the exact current main commit and its green artifact checks

inputs:
  github_token:
    description: Token used only to inspect main and its checks
    required: true
  head_sha:
    description: Exact main commit proposed for production
    required: true

runs:
  using: composite
  steps:
    - name: Verify exact main commit and required checks
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        HEAD_SHA: ${{ inputs.head_sha }}
      run: |
        if [ "${#HEAD_SHA}" -ne 40 ]; then
          echo "Production SHA must contain 40 characters" >&2
          exit 1
        fi
        case "$HEAD_SHA" in
          *[!0-9a-f]*)
            echo "Production SHA must be lowercase hexadecimal" >&2
            exit 1
            ;;
        esac

        main_sha="$(
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
            --jq '.object.sha'
        )"
        test "$main_sha" = "$HEAD_SHA"

        required_checks=(
          "Hermetic repository contract"
          "Portable artifact and fresh database"
        )

        for _ in $(seq 1 120); do
          checks_json="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?per_page=100"
          )"
          all_green=true
          for check_name in "${required_checks[@]}"; do
            conclusion="$(
              jq -r --arg name "$check_name" \
                '[.check_runs[] |
                  select(.name == $name and .app.slug == "github-actions")] |
                  last | .conclusion // ""' \
                <<<"$checks_json"
            )"
            if [ "$conclusion" != "success" ]; then
              all_green=false
            fi
          done
          if [ "$all_green" = true ]; then
            exit 0
          fi
          sleep 5
        done

        echo "Required checks did not become green for main SHA $HEAD_SHA" >&2
        exit 1
