name: Verify production source
description: Require the exact current main commit and its green artifact checks

inputs:
  github_token:
    description: Token used only to inspect main and its checks
    required: true
  head_sha:
    description: Exact main commit proposed for production
    required: true

runs:
  using: composite
  steps:
    - name: Verify exact main commit and required checks
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        HEAD_SHA: ${{ inputs.head_sha }}
      run: bash scripts/automation/github_delivery.sh production
