name: Heroku preview delivery
description: Release and probe prebuilt process images for one deterministic preview

inputs:
  core_database_password:
    description: Preview native runtime role password
    required: true
  head_sha:
    description: Exact pull request head commit to deploy
    required: true
  extension_registry_url:
    description: Verified sibling static Registry origin for this preview
    required: true
  heroku_api_key:
    description: Heroku authorization for preview app lifecycle
    required: true
  jwt_secret:
    description: Repository signing secret shared by canonical deployments
    required: true
  neon_api_key:
    description: Neon authorization for resolving the preview connection
    required: true
  neon_project_id:
    description: Neon project containing preview branches
    required: true
  postgrest_database_password:
    description: Preview PostgREST authenticator role password
    required: true
  pr_number:
    description: Pull request number
    required: true
runs:
  using: composite
  steps:
    - name: Install pinned deployment CLIs
      shell: bash
      run: npm install --global heroku@11.8.1

    - name: Resolve exact matching Neon preview branch
      id: neon
      shell: bash
      env:
        NEON_API_KEY: ${{ inputs.neon_api_key }}
        NEON_PROJECT_ID: ${{ inputs.neon_project_id }}
        PR_NUMBER: ${{ inputs.pr_number }}
      run: |
        branches_json="$(
          npx --yes neonctl@2.36.0 branches list \
            --project-id "$NEON_PROJECT_ID" \
            --output json \
            --no-analytics \
            --no-color
        )"
        matches="$(
          jq -c --arg name "preview/core-py/pr-$PR_NUMBER" \
            '[.[] | select(.name == $name)]' <<<"$branches_json"
        )"
        test "$(jq 'length' <<<"$matches")" = 1
        branch_id="$(jq -r '.[0].id' <<<"$matches")"
        test -n "$(jq -r '.[0].expires_at // empty' <<<"$matches")"

        runtime_database_url="$(
          npx --yes neonctl@2.36.0 connection-string \
            "$branch_id" \
            --project-id "$NEON_PROJECT_ID" \
            --role-name neondb_owner \
            --pooled \
            --no-color
        )"
        migration_database_url="$(
          npx --yes neonctl@2.36.0 connection-string \
            "$branch_id" \
            --project-id "$NEON_PROJECT_ID" \
            --role-name neondb_owner \
            --no-pooled \
            --no-color
        )"
        echo "::add-mask::$runtime_database_url"
        echo "::add-mask::$migration_database_url"
        echo "branch_id=$branch_id" >> "$GITHUB_OUTPUT"
        echo "runtime_database_url=$runtime_database_url" >> "$GITHUB_OUTPUT"
        echo "migration_database_url=$migration_database_url" >> "$GITHUB_OUTPUT"

    - name: Normalize inherited provider roles on first bootstrap
      shell: bash
      env:
        BRANCH_ID: ${{ steps.neon.outputs.branch_id }}
        HEAD_SHA: ${{ inputs.head_sha }}
        MIGRATION_DATABASE_URL: ${{ steps.neon.outputs.migration_database_url }}
        NEON_API_KEY: ${{ inputs.neon_api_key }}
        NEON_PROJECT_ID: ${{ inputs.neon_project_id }}
      run: |
        environment="$(
          docker run --rm \
            --env MIGRATION_DATABASE_URL \
            --entrypoint python \
            "inkcre-preview-web:$HEAD_SHA" \
            scripts/database_environment.py
        )"
        if [ "$environment" = "preview" ]; then
          exit 0
        fi
        if [ "$environment" != "runtime" ] && [ "$environment" != "absent" ]; then
          echo "Refusing preview bootstrap from environment $environment" >&2
          exit 1
        fi

        roles_json="$(
          npx --yes neonctl@2.36.0 roles list \
            --project-id "$NEON_PROJECT_ID" \
            --branch "$BRANCH_ID" \
            --output json \
            --no-analytics \
            --no-color
        )"
        for role in authenticated anonymous authenticator inkcre_core; do
          if jq -e --arg role "$role" \
            'any(.[]; .name == $role)' <<<"$roles_json" >/dev/null; then
            npx --yes neonctl@2.36.0 roles delete "$role" \
              --project-id "$NEON_PROJECT_ID" \
              --branch "$BRANCH_ID" \
              --no-analytics \
              --no-color
          fi
        done

    - name: Initialize and verify exact preview database contract
      id: database
      shell: bash
      env:
        CORE_DATABASE_PASSWORD: ${{ inputs.core_database_password }}
        HEAD_SHA: ${{ inputs.head_sha }}
        MIGRATION_DATABASE_URL: ${{ steps.neon.outputs.migration_database_url }}
        POSTGREST_DATABASE_PASSWORD: ${{ inputs.postgrest_database_password }}
        SOURCE_DATABASE_URL: ${{ steps.neon.outputs.runtime_database_url }}
      run: |
        docker run --rm \
          --env CORE_DATABASE_PASSWORD \
          --env MIGRATION_DATABASE_URL \
          --env POSTGREST_DATABASE_PASSWORD \
          "inkcre-preview-web:$HEAD_SHA" \
          python scripts/container.py \
          db init --profile runtime --environment preview
        docker run --rm \
          --env MIGRATION_DATABASE_URL \
          "inkcre-preview-web:$HEAD_SHA" \
          python scripts/container.py \
          db ready --profile runtime --json

        runtime_database_url="$(
          docker run --rm \
            --env SOURCE_DATABASE_URL \
            --env TARGET_DATABASE_PASSWORD="$CORE_DATABASE_PASSWORD" \
            --env TARGET_DATABASE_ROLE=inkcre_core \
            --entrypoint python \
            "inkcre-preview-web:$HEAD_SHA" \
            scripts/rebind_database_url.py \
            --scheme postgresql+psycopg
        )"
        postgrest_database_url="$(
          docker run --rm \
            --env SOURCE_DATABASE_URL \
            --env TARGET_DATABASE_PASSWORD="$POSTGREST_DATABASE_PASSWORD" \
            --env TARGET_DATABASE_ROLE=authenticator \
            --entrypoint python \
            "inkcre-preview-web:$HEAD_SHA" \
            scripts/rebind_database_url.py \
            --scheme postgresql
        )"
        echo "::add-mask::$runtime_database_url"
        echo "::add-mask::$postgrest_database_url"
        echo "runtime_database_url=$runtime_database_url" >> "$GITHUB_OUTPUT"
        echo "postgrest_database_url=$postgrest_database_url" >> "$GITHUB_OUTPUT"

    - name: Create or verify deterministic Heroku apps
      id: heroku
      shell: bash
      env:
        DATABASE_URL: ${{ steps.database.outputs.runtime_database_url }}
        HEROKU_API_KEY: ${{ inputs.heroku_api_key }}
        PR_NUMBER: ${{ inputs.pr_number }}
      run: |
        app_name="inkcre-core-py-pr-$PR_NUMBER"
        postgrest_app_name="inkcre-postgrest-pr-$PR_NUMBER"
        if ! app_json="$(heroku apps:info --app "$app_name" --json 2>/dev/null)"; then
          heroku apps:create "$app_name" --region us --stack container
          app_json="$(heroku apps:info --app "$app_name" --json)"
        fi

        test "$(jq -r '.app.stack.name' <<<"$app_json")" = "container"
        test "$(jq -r '.app.region.name' <<<"$app_json")" = "us"

        if ! postgrest_json="$(
          heroku apps:info --app "$postgrest_app_name" --json 2>/dev/null
        )"; then
          heroku apps:create "$postgrest_app_name" --region us --stack container
          postgrest_json="$(heroku apps:info --app "$postgrest_app_name" --json)"
        fi
        test "$(jq -r '.app.stack.name' <<<"$postgrest_json")" = "container"
        test "$(jq -r '.app.region.name' <<<"$postgrest_json")" = "us"

        pipeline_json="$(heroku pipelines:info inkcre-core --json)"
        for preview_app in "$app_name" "$postgrest_app_name"; do
          stage="$(
            jq -r --arg app "$preview_app" \
              '.apps[] | select(.name == $app) | .pipelineCoupling.stage // empty' \
              <<<"$pipeline_json"
          )"
          if [ -z "$stage" ]; then
            heroku pipelines:add inkcre-core --app "$preview_app" --stage review
          else
            test "$stage" = "review"
          fi
        done

        web_url="$(jq -r '.app.web_url' <<<"$app_json")"
        postgrest_url="$(jq -r '.app.web_url' <<<"$postgrest_json")"
        deployed_release="$(
          heroku releases --app "$app_name" --json |
            jq -r \
              '[.[] |
                select(.status == "succeeded" and
                  (.description | startswith("Deployed web")))] |
                first | .version // empty'
        )"
        postgrest_deployed_release="$(
          heroku releases --app "$postgrest_app_name" --json |
            jq -r \
              '[.[] |
                select(.status == "succeeded" and
                  (.description | startswith("Deployed web")))] |
                first | .version // empty'
        )"
        url_host() {
          python -c \
            'import sys; from urllib.parse import urlparse; print(urlparse(sys.argv[1]).hostname or "")' \
            "$1"
        }
        has_deployed_release=false
        if [ -n "$deployed_release" ]; then
          has_deployed_release=true
          current_database_url="$(
            heroku config:get DATABASE_URL --app "$app_name" || true
          )"
          test -n "$current_database_url"
          test "$(url_host "$current_database_url")" = \
            "$(url_host "$DATABASE_URL")"
        fi
        has_postgrest_release=false
        if [ -n "$postgrest_deployed_release" ]; then
          has_postgrest_release=true
          current_postgrest_database_url="$(
            heroku config:get PGRST_DB_URI --app "$postgrest_app_name" || true
          )"
          test -n "$current_postgrest_database_url"
          test "$(url_host "$current_postgrest_database_url")" = \
            "$(url_host "$DATABASE_URL")"
        fi

        echo "app_name=$app_name" >> "$GITHUB_OUTPUT"
        echo "has_deployed_release=$has_deployed_release" >> "$GITHUB_OUTPUT"
        echo "has_postgrest_release=$has_postgrest_release" >> "$GITHUB_OUTPUT"
        echo "postgrest_app_name=$postgrest_app_name" >> "$GITHUB_OUTPUT"
        echo "postgrest_url=$postgrest_url" >> "$GITHUB_OUTPUT"
        echo "web_url=$web_url" >> "$GITHUB_OUTPUT"

    - name: Push and release preview peer transports
      shell: bash
      env:
        APP_NAME: ${{ steps.heroku.outputs.app_name }}
        DATABASE_URL: ${{ steps.database.outputs.runtime_database_url }}
        EXTENSION_REGISTRY_URL: ${{ inputs.extension_registry_url }}
        HAS_POSTGREST_RELEASE: ${{ steps.heroku.outputs.has_postgrest_release }}
        HEAD_SHA: ${{ inputs.head_sha }}
        HEROKU_API_KEY: ${{ inputs.heroku_api_key }}
        JWT_SECRET: ${{ inputs.jwt_secret }}
        PR_NUMBER: ${{ inputs.pr_number }}
        POSTGREST_APP_NAME: ${{ steps.heroku.outputs.postgrest_app_name }}
        POSTGREST_DATABASE_URL: ${{ steps.database.outputs.postgrest_database_url }}
        WEB_URL: ${{ steps.heroku.outputs.web_url }}
      run: |
        wait_for_release() {
          local app_name="$1"
          local version="$2"
          local status
          for _ in $(seq 1 120); do
            status="$(
              heroku releases --app "$app_name" --json |
                jq -r --argjson version "$version" \
                  '.[] | select(.version == $version) | .status'
            )"
            case "$status" in
              succeeded)
                return 0
                ;;
              failed)
                heroku releases:output "v$version" --app "$app_name"
                return 1
                ;;
            esac
            sleep 5
          done
          echo "Timed out waiting for $app_name release v$version" >&2
          return 1
        }

        retry_command() {
          local max_attempts="$1"
          shift
          local attempt
          for attempt in $(seq 1 "$max_attempts"); do
            if "$@"; then
              return 0
            fi
            if [ "$attempt" -lt "$max_attempts" ]; then
              sleep "$((attempt * 2))"
            fi
          done
          return 1
        }

        login_registry() {
          local max_attempts=5
          local attempt
          for attempt in $(seq 1 "$max_attempts"); do
            if printf '%s' "$HEROKU_API_KEY" |
              docker login --username=_ --password-stdin \
                registry.heroku.com; then
              return 0
            fi
            if [ "$attempt" -lt "$max_attempts" ]; then
              sleep "$((attempt * 2))"
            fi
          done
          return 1
        }

        configure_app() {
          local before_release
          local peer_id
          local release_version

          before_release="$(
            heroku releases --app "$APP_NAME" --json |
              jq -r '.[0].version // empty'
          )"
          peer_id="$(
            python -c \
              "import uuid; print(uuid.uuid5(uuid.NAMESPACE_URL, 'inkcre-core-py-pr-$PR_NUMBER'))"
          )"
          heroku config:set --app "$APP_NAME" \
            "DATABASE_SCALE_0=true" \
            "DATABASE_URL=$DATABASE_URL" \
            "EXTENSION_REGISTRY_URL=$EXTENSION_REGISTRY_URL" \
            "INKCRE_ENV_FILE=" \
            "JWT_SECRET=$JWT_SECRET" \
            "OBSRV__LOGGING_BACKEND=none" \
            "PEER_ID=$peer_id" \
            "PEER_NAME=core-py-pr-$PR_NUMBER" \
            "SKIP_EXTENSIONS_SYNC=0" >/dev/null
          heroku config:unset \
            CLIENT_BASE_URL CLIENT_ID CLIENT_NAME LLM_SP_AK LLM_SP_BASE_URL \
            --app "$APP_NAME" >/dev/null || true
          if [ -n "$(
            heroku config:get MIGRATION_DATABASE_URL --app "$APP_NAME" || true
          )" ]; then
            heroku config:unset MIGRATION_DATABASE_URL \
              --app "$APP_NAME" >/dev/null
          fi
          release_version="$(
            heroku releases --app "$APP_NAME" --json |
              jq -r '.[0].version // empty'
          )"
          if [ "$release_version" != "$before_release" ]; then
            wait_for_release "$APP_NAME" "$release_version"
          fi
        }

        configure_postgrest() {
          local before_release
          local release_version

          before_release="$(
            heroku releases --app "$POSTGREST_APP_NAME" --json |
              jq -r '.[0].version // empty'
          )"
          heroku config:set --app "$POSTGREST_APP_NAME" \
            "PGRST_DB_ANON_ROLE=anonymous" \
            "PGRST_DB_POOL=2" \
            "PGRST_DB_PRE_REQUEST=inkcre_internal.check_jwt" \
            "PGRST_DB_SCHEMAS=inkcre" \
            "PGRST_DB_URI=$POSTGREST_DATABASE_URL" \
            "PGRST_JWT_AUD=inkcre-api" \
            "PGRST_JWT_SECRET=$JWT_SECRET" >/dev/null
          release_version="$(
            heroku releases --app "$POSTGREST_APP_NAME" --json |
              jq -r '.[0].version // empty'
          )"
          if [ "$release_version" != "$before_release" ]; then
            wait_for_release "$POSTGREST_APP_NAME" "$release_version"
          fi
        }

        test -n "$JWT_SECRET"
        test -n "$EXTENSION_REGISTRY_URL"
        echo "::add-mask::$JWT_SECRET"

        configure_app
        if [ "$HAS_POSTGREST_RELEASE" = false ]; then
          configure_postgrest
        fi

        login_registry
        docker tag \
          "inkcre-preview-web:$HEAD_SHA" \
          "registry.heroku.com/$APP_NAME/web"
        docker tag \
          "inkcre-preview-release:$HEAD_SHA" \
          "registry.heroku.com/$APP_NAME/release"
        docker tag \
          "inkcre-preview-postgrest:$HEAD_SHA" \
          "registry.heroku.com/$POSTGREST_APP_NAME/web"
        retry_command 5 docker push "registry.heroku.com/$APP_NAME/web"
        retry_command 5 docker push "registry.heroku.com/$APP_NAME/release"
        retry_command 5 docker push "registry.heroku.com/$POSTGREST_APP_NAME/web"

        before_guard_release="$(
          heroku releases --app "$APP_NAME" --json |
            jq -r '.[0].version // empty'
        )"
        heroku container:release release --app "$APP_NAME"
        guard_release="$(
          heroku releases --app "$APP_NAME" --json |
            jq -r '.[0].version // empty'
        )"
        if [ "$guard_release" != "$before_guard_release" ]; then
          wait_for_release "$APP_NAME" "$guard_release"
        fi

        before_web_release="$(
          heroku releases --app "$APP_NAME" --json |
            jq -r '.[0].version // empty'
        )"
        heroku container:release web --app "$APP_NAME"
        web_release="$(
          heroku releases --app "$APP_NAME" --json |
            jq -r '.[0].version // empty'
        )"
        if [ "$web_release" != "$before_web_release" ]; then
          wait_for_release "$APP_NAME" "$web_release"
        fi

        before_postgrest_release="$(
          heroku releases --app "$POSTGREST_APP_NAME" --json |
            jq -r '.[0].version // empty'
        )"
        heroku container:release web --app "$POSTGREST_APP_NAME"
        postgrest_release="$(
          heroku releases --app "$POSTGREST_APP_NAME" --json |
            jq -r '.[0].version // empty'
        )"
        if [ "$postgrest_release" != "$before_postgrest_release" ]; then
          wait_for_release "$POSTGREST_APP_NAME" "$postgrest_release"
        fi

        if [ "$HAS_POSTGREST_RELEASE" = true ]; then
          configure_postgrest
        fi

        heroku ps:scale web=1:eco --app "$APP_NAME"
        heroku ps:scale web=1:eco --app "$POSTGREST_APP_NAME"

    - name: Converge preview Peer advertisement
      shell: bash
      env:
        DATABASE_URL: ${{ steps.database.outputs.runtime_database_url }}
        HEAD_SHA: ${{ inputs.head_sha }}
        PR_NUMBER: ${{ inputs.pr_number }}
        WEB_URL: ${{ steps.heroku.outputs.web_url }}
      run: |
        if ! docker run --rm \
          --entrypoint python \
          "inkcre-preview-release:$HEAD_SHA" \
          -c \
          'from pathlib import Path; raise SystemExit(0 if Path("/app/scripts/configure_peer_runtime.py").is_file() else 1)'; then
          {
            echo "### Preview runtime compatibility"
            echo
            echo "- Peer advertisement: skipped for a pre-Peer Client image"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        peer_id="$(
          python -c \
            "import uuid; print(uuid.uuid5(uuid.NAMESPACE_URL, 'inkcre-core-py-pr-$PR_NUMBER'))"
        )"
        docker run --rm \
          --env DATABASE_URL \
          "inkcre-preview-release:$HEAD_SHA" \
          python scripts/configure_peer_runtime.py \
          --peer-id "$peer_id" \
          --http-public-base-url "$WEB_URL"

    - name: Probe deployed preview
      shell: bash
      env:
        APP_NAME: ${{ steps.heroku.outputs.app_name }}
        HEAD_SHA: ${{ inputs.head_sha }}
        HEROKU_API_KEY: ${{ inputs.heroku_api_key }}
        POSTGREST_APP_NAME: ${{ steps.heroku.outputs.postgrest_app_name }}
        POSTGREST_URL: ${{ steps.heroku.outputs.postgrest_url }}
        WEB_URL: ${{ steps.heroku.outputs.web_url }}
      run: |
        jwt_secret="$(heroku config:get JWT_SECRET --app "$APP_NAME")"
        test -n "$jwt_secret"
        echo "::add-mask::$jwt_secret"
        for _ in $(seq 1 60); do
          if curl --fail --silent "${WEB_URL}livez" >/dev/null &&
            curl --fail --silent "${WEB_URL}readyz" >/dev/null &&
            docker run --rm \
              --entrypoint python \
              "inkcre-preview-web:$HEAD_SHA" \
              scripts/verify_postgrest_contract.py \
              --base-url "$POSTGREST_URL" \
              --jwt-secret "$jwt_secret" \
              --wrong-jwt-secret "wrong-$jwt_secret"; then
            {
              echo "### Heroku preview"
              echo
              echo "- App: \`$APP_NAME\`"
              echo "- URL: $WEB_URL"
              echo "- PostgREST app: `$POSTGREST_APP_NAME`"
              echo "- PostgREST URL: $POSTGREST_URL"
              echo "- Liveness: ready"
              echo "- Readiness: ready"
              echo "- PostgREST JWT read/write/deny contract: ready"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          sleep 5
        done

        heroku logs --num 200 --app "$APP_NAME"
        heroku logs --num 200 --app "$POSTGREST_APP_NAME"
        exit 1
