name: Verify preview source
description: Require an open same-repository pull request and green checks for its exact head

inputs:
  github_token:
    description: Token used only to inspect the pull request and its checks
    required: true
  head_sha:
    description: Exact pull request head commit to verify
    required: true
  pr_number:
    description: Pull request number
    required: true

runs:
  using: composite
  steps:
    - name: Verify trusted pull request and required checks
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        HEAD_SHA: ${{ inputs.head_sha }}
        PR_NUMBER: ${{ inputs.pr_number }}
      run: bash "$GITHUB_ACTION_PATH/../../../scripts/automation/github_delivery.sh" preview
