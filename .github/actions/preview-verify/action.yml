name: Verify preview source
description: Require an open same-repository pull request and green checks for its exact head

inputs:
  github_token:
    description: Token used only to inspect the pull request and its checks
    required: true
  head_sha:
    description: Exact pull request head commit to verify
    required: true
  pr_number:
    description: Pull request number
    required: true

runs:
  using: composite
  steps:
    - name: Verify trusted pull request and required checks
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        HEAD_SHA: ${{ inputs.head_sha }}
        PR_NUMBER: ${{ inputs.pr_number }}
      run: |
        case "$PR_NUMBER" in
          ''|*[!0-9]*)
            echo "Invalid pull request number" >&2
            exit 1
            ;;
        esac

        pr_json="$(
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER"
        )"
        test "$(jq -r '.head.repo.full_name' <<<"$pr_json")" = "$GITHUB_REPOSITORY"
        test "$(jq -r '.head.sha' <<<"$pr_json")" = "$HEAD_SHA"
        test "$(jq -r '.state' <<<"$pr_json")" = "open"

        required_checks=(
          "Hermetic repository contract"
          "Portable artifact and fresh database"
          "Provision and migrate"
        )

        for _ in $(seq 1 120); do
          checks_json="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?per_page=100"
          )"
          all_green=true
          for check_name in "${required_checks[@]}"; do
            conclusion="$(
              jq -r --arg name "$check_name" \
                '[.check_runs[] |
                  select(.name == $name and .app.slug == "github-actions")] |
                  last | .conclusion // ""' \
                <<<"$checks_json"
            )"
            if [ "$conclusion" != "success" ]; then
              all_green=false
            fi
          done
          if [ "$all_green" = true ]; then
            exit 0
          fi
          sleep 5
        done

        echo "Required checks did not become green for $HEAD_SHA" >&2
        exit 1
